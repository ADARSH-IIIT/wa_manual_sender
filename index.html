<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet Message Launcher</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --sunken:#efefec; --line:#dcdcd7; --fg:#1b1d1c; --muted:#646864;
  --accent:#15803d; --accent-fg:#ffffff; --accent-soft:#e6f3ea;
  --bad:#b3261e; --bad-soft:#fbe4e1;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121413; --surface:#1a1d1b; --sunken:#222624; --line:#323733; --fg:#e8eae8; --muted:#9ca29d;
  --accent:#4ade80; --accent-fg:#0b1a10; --accent-soft:#1c3324;
  --bad:#ff8a80; --bad-soft:#3b1b18; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121413; --surface:#1a1d1b; --sunken:#222624; --line:#323733; --fg:#e8eae8; --muted:#9ca29d;
  --accent:#4ade80; --accent-fg:#0b1a10; --accent-soft:#1c3324;
  --bad:#ff8a80; --bad-soft:#3b1b18; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:1.5rem;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.field{display:flex;flex-direction:column;gap:8px}
.lbl{font-weight:600}
.link{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;background:var(--surface);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent)}
#file:focus-visible + .drop{outline:2px solid var(--accent);outline-offset:2px}
.err{font-size:.88rem;background:var(--bad-soft);color:var(--bad);padding:8px 11px;border-radius:8px}

.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:4px 11px;border-radius:999px;cursor:pointer;touch-action:manipulation}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.editor{position:relative;min-height:140px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);white-space:pre-wrap;word-break:break-word;line-height:1.65;cursor:text}
.editor:focus{outline:none;border-color:var(--accent)}
.editor.empty::before{content:attr(data-ph);position:absolute;inset:12px;color:var(--muted);pointer-events:none}
.pill{display:inline-block;padding:0 7px;margin:0 1px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:.9em;font-weight:600;line-height:1.55;user-select:all;-webkit-user-select:all;cursor:default}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg label{padding:8px 16px;cursor:pointer;color:var(--muted);font-size:.92rem}
.seg label + label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-fg);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.pos{color:var(--muted);font-variant-numeric:tabular-nums}
.who{font-weight:600;font-variant-numeric:tabular-nums}
.tag{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--accent)}
.tag.bad{color:var(--bad)}
.msg{white-space:pre-wrap;word-break:break-word;background:var(--sunken);border-radius:8px;padding:12px;min-height:5em}
.msg mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.msg .miss{background:var(--bad-soft);color:var(--bad);border-radius:3px;padding:0 3px;font-size:.88em}

.nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
.nav .primary{white-space:normal;text-align:center}
@media (max-width:420px){ .nav .btn{padding:10px 11px} }
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;white-space:nowrap;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<main class="wrap">
  <div>
    <h1>Sheet Message Launcher</h1>
    <p class="muted">Your sheet is read in this browser only. Nothing is uploaded.</p>
  </div>

  <div class="field">
    <span class="lbl">Contacts</span>
    <input type="file" id="file" class="vh" accept=".xlsx,.xls,.xlsm,.csv,.ods">
    <label class="drop" id="drop" for="file">
      <strong id="dropTitle">Drop your Excel or CSV file, or click to choose</strong><br>
      <span class="muted small" id="dropSub">Row 1 = column names. Column A = phone number.</span>
    </label>
    <p class="err" id="err" hidden></p>
    <p class="muted small">10-digit numbers get +91 added. <button type="button" class="link" id="sample">Download a sample sheet</button></p>
  </div>

  <div class="field">
    <span class="lbl" id="msgLbl">Message</span>
    <div class="chips" id="chips"></div>
    <div class="editor empty" id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="msgLbl"
         spellcheck="true" data-ph="Type your message, then click a column above to add it."></div>
  </div>

  <div class="field">
    <span class="lbl">Open chats in</span>
    <div class="seg" role="radiogroup" aria-label="Open chats in">
      <label><input type="radio" name="mode" value="web">WhatsApp Web</label>
      <label><input type="radio" name="mode" value="app">WhatsApp app</label>
    </div>
    <p class="muted small" id="modeHint"></p>
  </div>

  <section class="card" aria-live="polite">
    <div class="chead">
      <span class="pos" id="pos"></span>
      <span class="who" id="who"></span>
      <span class="tag" id="tag" hidden></span>
    </div>
    <p class="msg" id="msg"></p>
    <div class="nav">
      <button type="button" class="btn" id="prev">← Prev</button>
      <a class="btn primary" id="open" href="#" target="whatsapp_tab"></a>
      <button type="button" class="btn" id="next">Next →</button>
    </div>
  </section>
</main>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = k => String(k).trim().toLowerCase().replace(/[\s_\-]+/g,'_');
const RE = /\{\{\s*([^{}]+?)\s*\}\}/g;
const HAS_VAR = /\{\{[^{}]+\}\}/;
const COUNTRY = '91'; // added to plain 10-digit numbers
const get = (k,d) => { try{ const v = localStorage.getItem(k); return v == null ? d : v }catch(e){ return d } };
const put = (k,v) => { try{ localStorage.setItem(k,v) }catch(e){} };
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

let headers = [], rows = [], i = 0, opened = new Set(), loaded = false;
let mode = get('wsl-mode', MOBILE ? 'app' : 'web');
let tpl = get('wsl-tpl', '');

/* ---------- Sheet parsing ---------- */
function setData(raw, fmt){
  const h = raw.findIndex(r => r && r.some(c => String(c).trim() !== ''));
  if(h < 0) throw new Error('This sheet is empty. Put column names in row 1 and numbers in column A.');
  const hdr = fmt[h] || raw[h];
  headers = hdr.map((c, j) => String(c).trim() || (j === 0 ? 'whatsapp_number' : 'column_' + (j + 1)));
  rows = [];
  for(let r = h + 1; r < raw.length; r++){
    const a = raw[r] || [], f = fmt[r] || [];
    if(!a.some(c => String(c).trim() !== '')) continue;
    const vals = {};
    headers.forEach((hd, j) => { const k = norm(hd); if(!(k in vals)) vals[k] = String(f[j] ?? a[j] ?? '').trim(); });
    rows.push({ raw:a[0], vals });
  }
  i = 0; opened = new Set();
}

function phone(v){
  let s = typeof v === 'number' ? String(Math.round(v)) : String(v ?? '').trim();
  if(/^\d+(\.\d+)?e\+\d+$/i.test(s)) s = String(Math.round(Number(s)));
  const plus = s.startsWith('+');
  let d = s.replace(/\D/g, '');
  if(!plus && d.startsWith('00')) d = d.slice(2);
  if(!plus && d.length === 11 && d.startsWith('0')) d = COUNTRY + d.slice(1);
  else if(!plus && d.length === 10) d = COUNTRY + d;
  return d;
}
const fill = (t, row) => t.replace(RE, (m, k) => row.vals[norm(k)] ?? '').trim();
function fillHTML(t, row){
  let out = '', last = 0;
  for(const m of t.matchAll(RE)){
    out += esc(t.slice(last, m.index));
    const v = row.vals[norm(m[1])];
    out += v ? `<mark>${esc(v)}</mark>` : `<span class="miss">${esc(m[1])} is empty</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(t.slice(last));
}

/* ---------- Message editor: columns are inserted as tags ---------- */
const ed = $('#editor');
let savedRange = null;

function makePill(name){
  const s = document.createElement('span');
  s.className = 'pill'; s.contentEditable = 'false'; s.dataset.var = name; s.textContent = name;
  return s;
}
function setEditor(t){
  ed.textContent = '';
  const addText = s => s.split('\n').forEach((part, k) => {
    if(k) ed.appendChild(document.createElement('br'));
    if(part) ed.appendChild(document.createTextNode(part));
  });
  let last = 0;
  for(const m of t.matchAll(RE)){
    addText(t.slice(last, m.index));
    ed.append(makePill(m[1].trim()), document.createTextNode('​'));
    last = m.index + m[0].length;
  }
  addText(t.slice(last));
  if(t.endsWith('\n')) ed.appendChild(document.createElement('br'));
}
function readEditor(){
  let out = '';
  const walk = n => {
    for(const c of n.childNodes){
      if(c.nodeType === 3) out += c.nodeValue.replace(/​/g, '');
      else if(c.nodeType !== 1) continue;
      else if(c.dataset && c.dataset.var != null) out += `{{${c.dataset.var}}}`;
      else if(c.nodeName === 'BR') out += '\n';
      else if(/^(DIV|P)$/.test(c.nodeName)){ if(out && !out.endsWith('\n')) out += '\n'; walk(c); }
      else walk(c);
    }
  };
  walk(ed);
  return out.replace(/\n$/, '');
}
function caretToEnd(){
  const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function markPills(){
  const known = new Set(headers.map(norm));
  ed.querySelectorAll('.pill').forEach(p => {
    const bad = loaded && !known.has(norm(p.dataset.var));
    p.classList.toggle('bad', bad);
    p.title = bad ? `Your sheet has no column called "${p.dataset.var}"` : '';
  });
}
function onEdit(){
  tpl = readEditor();
  put('wsl-tpl', tpl);
  if(!tpl && ed.innerHTML) ed.innerHTML = '';
  ed.classList.toggle('empty', !tpl);
  markPills();
  render();
}
function insertVar(name){
  ed.focus();
  const sel = getSelection();
  const live = sel.rangeCount && ed.contains(sel.getRangeAt(0).startContainer) ? sel.getRangeAt(0) : null;
  let r = live || (savedRange && ed.contains(savedRange.startContainer) ? savedRange : null);
  if(!r){ r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); }
  r.deleteContents();
  const pill = makePill(name), zw = document.createTextNode('​');
  const frag = document.createDocumentFragment(); frag.append(pill, zw);
  r.insertNode(frag);
  const after = document.createRange(); after.setStart(zw, 1); after.collapse(true);
  sel.removeAllRanges(); sel.addRange(after);
  savedRange = after.cloneRange();
  onEdit();
}

document.addEventListener('selectionchange', () => {
  const s = getSelection();
  if(s.rangeCount && ed.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange();
});
ed.addEventListener('input', onEdit);
ed.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    if(!document.execCommand('insertLineBreak')){
      const r = getSelection().getRangeAt(0), br = document.createElement('br');
      r.deleteContents(); r.insertNode(br); r.setStartAfter(br); r.collapse(true);
      onEdit();
    }
  }
});
ed.addEventListener('paste', e => {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
  if(HAS_VAR.test(text)){ setEditor(readEditor()); caretToEnd(); onEdit(); }
});
ed.addEventListener('drop', e => e.preventDefault());
// {{column}} typed by hand becomes a tag when leaving the editor.
ed.addEventListener('blur', () => {
  const typed = [...ed.childNodes].some(n => n.nodeType === 3 && HAS_VAR.test(n.nodeValue));
  if(typed){ setEditor(readEditor()); onEdit(); }
});

const chips = $('#chips');
chips.addEventListener('mousedown', e => { if(e.target.closest('.chip')) e.preventDefault(); });
chips.addEventListener('click', e => { const b = e.target.closest('[data-ins]'); if(b) insertVar(b.dataset.ins); });

/* ---------- Render ---------- */
function render(){
  const cols = headers.slice(1);
  chips.innerHTML = !loaded
    ? '<span class="muted small">Add a sheet to insert its columns here.</span>'
    : !cols.length
      ? '<span class="muted small">Your sheet only has a number column.</span>'
      : '<span class="muted small">Insert:</span>' + cols.map(h => `<button type="button" class="chip" data-ins="${esc(h)}">${esc(h)}</button>`).join('');

  document.querySelectorAll('input[name=mode]').forEach(r => r.checked = r.value === mode);
  $('#modeHint').textContent = mode === 'web'
    ? 'Opens web.whatsapp.com in one browser tab, reused for every contact. Best on a computer.'
    : 'Opens the WhatsApp app on this phone or computer. Best on a phone.';

  const open = $('#open');
  open.textContent = mode === 'web' ? 'Open in WhatsApp Web' : 'Open in WhatsApp app';

  if(!rows.length){
    $('#pos').textContent = ''; $('#who').textContent = loaded ? 'No contacts found in this sheet' : 'Add a sheet to start';
    $('#msg').textContent = ''; $('#tag').hidden = true;
    open.setAttribute('aria-disabled', 'true'); open.href = '#';
    $('#prev').disabled = $('#next').disabled = true; return;
  }

  const row = rows[i], num = phone(row.raw), ok = num.length >= 8 && num.length <= 15;
  $('#pos').textContent = `${i + 1} / ${rows.length}`;
  $('#who').textContent = num ? '+' + num : 'No number';
  const tag = $('#tag');
  tag.hidden = !(opened.has(i) || !ok);
  tag.className = 'tag' + (ok ? '' : ' bad');
  tag.textContent = ok ? 'Opened' : 'Invalid number';
  $('#msg').innerHTML = fillHTML(tpl.trim(), row);

  if(ok && tpl.trim()){
    const text = encodeURIComponent(fill(tpl, row));
    open.href = mode === 'web' ? `https://web.whatsapp.com/send?phone=${num}&text=${text}` : `https://wa.me/${num}?text=${text}`;
    open.removeAttribute('aria-disabled');
  } else { open.href = '#'; open.setAttribute('aria-disabled', 'true'); }
  $('#prev').disabled = i === 0;
  $('#next').disabled = i === rows.length - 1;
}

/* ---------- File loading ---------- */
function showErr(m){ $('#err').textContent = m; $('#err').hidden = false; }
function readFile(file){
  $('#err').hidden = true;
  const csv = /\.csv$/i.test(file.name);
  const fr = new FileReader();
  fr.onload = () => {
    try{
      if(typeof XLSX === 'undefined') throw new Error('The spreadsheet reader did not load. Reload the page and try again.');
      const wb = csv ? XLSX.read(fr.result, {type:'string'}) : XLSX.read(new Uint8Array(fr.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      setData(XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''}), XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''}));
      loaded = true;
      $('#dropTitle').textContent = file.name;
      $('#dropSub').textContent = `${rows.length} contact${rows.length === 1 ? '' : 's'} loaded. Click or drop to replace.`;
      markPills(); render();
    }catch(e){ showErr(e.message || 'That file could not be read as a spreadsheet.'); }
  };
  fr.onerror = () => showErr('Could not read that file.');
  csv ? fr.readAsText(file) : fr.readAsArrayBuffer(file);
}

const drop = $('#drop');
$('#file').addEventListener('change', e => { const f = e.target.files[0]; if(f) readFile(f); e.target.value = ''; });
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if(f) readFile(f); });

$('#sample').addEventListener('click', () => {
  if(typeof XLSX === 'undefined') return showErr('The spreadsheet reader did not load. Reload the page and try again.');
  const ws = XLSX.utils.aoa_to_sheet([
    ['whatsapp_number','name','date'],
    ['9876543210','Asha','12 Nov'],
    ['+44 7700 900123','Rahul','14 Nov'],
  ]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Contacts');
  XLSX.writeFile(wb, 'sample-contacts.xlsx');
});

/* ---------- Mode + navigation ---------- */
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => { mode = r.value; put('wsl-mode', mode); render(); }));
$('#prev').addEventListener('click', () => { if(i > 0){ i--; render(); } });
$('#next').addEventListener('click', () => { if(i < rows.length - 1){ i++; render(); } });
$('#open').addEventListener('click', e => {
  if(e.currentTarget.getAttribute('aria-disabled') === 'true'){ e.preventDefault(); return; }
  const at = i; setTimeout(() => { opened.add(at); render(); }, 0);
});
document.addEventListener('keydown', e => {
  if(e.target.isContentEditable || e.target.closest('input,textarea')) return;
  if(e.key === 'ArrowRight') $('#next').click();
  if(e.key === 'ArrowLeft') $('#prev').click();
});

setEditor(tpl);
ed.classList.toggle('empty', !tpl);
markPills();
render();
})();
</script>
</body>
</html>
